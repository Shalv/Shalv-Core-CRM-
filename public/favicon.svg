<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Top-right purple/magenta inner ribbon -->
    <linearGradient id="topPurple" x1="48" y1="14" x2="108" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="45%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>

    <!-- Top-left cyan/blue arch ribbon -->
    <linearGradient id="topCyanBlue" x1="16" y1="54" x2="86" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Left vertical cyan-to-cobalt ribbon -->
    <linearGradient id="leftBlue" x1="18" y1="28" x2="46" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="35%" stop-color="#0091EA" />
      <stop offset="75%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Bottom-right cyan outer tip -->
    <linearGradient id="bottomCyanTip" x1="60" y1="112" x2="112" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Bottom purple/magenta twist ribbon -->
    <linearGradient id="bottomPurple" x1="34" y1="98" x2="104" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="40%" stop-color="#9333EA" />
      <stop offset="80%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- 1. Top-Right Inner Purple/Magenta Ribbon Fold -->
  <path
    d="M46 20 C66 10, 96 18, 108 34 C113 41, 108 50, 98 49 C85 48, 72 38, 52 36 Z"
    fill="url(#topPurple)"
  />

  <!-- 2. Left Vertical Spine Ribbon -->
  <path
    d="M16 42 C14 64, 16 88, 30 104 C42 116, 58 114, 66 104 C50 96, 42 78, 42 56 C42 40, 48 26, 58 16 C38 16, 18 26, 16 42 Z"
    fill="url(#leftBlue)"
  />

  <!-- 3. Top-Left Cyan-to-Blue Sweeping Ribbon -->
  <path
    d="M16 52 C16 30, 38 10, 66 10 C82 10, 96 16, 104 26 C90 20, 72 20, 56 30 C42 38, 34 54, 30 70 C20 66, 16 59, 16 52 Z"
    fill="url(#topCyanBlue)"
  />

  <!-- 4. Bottom-Right Cyan Outer Curl -->
  <path
    d="M48 114 C70 120, 98 110, 110 92 C114 85, 110 76, 102 78 C92 80, 82 96, 62 104 Z"
    fill="url(#bottomCyanTip)"
  />

  <!-- 5. Bottom-Left to Bottom-Right Purple/Magenta Sweeping Ribbon -->
  <path
    d="M20 78 C24 98, 42 116, 66 116 C84 116, 98 104, 106 88 C109 81, 103 74, 94 76 C80 80, 68 94, 50 94 C36 94, 26 86, 20 78 Z"
    fill="url(#bottomPurple)"
  />
</svg>
