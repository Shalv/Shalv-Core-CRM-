<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" fill="none" width="760" height="190">
  <defs>
    <!-- Swirl 1: Top-Left to Top (Cyan to Blue) -->
    <linearGradient id="pcl-swirl-cyan" x1="25" y1="110" x2="120" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#00A0FF" />
      <stop offset="100%" stop-color="#0052FF" />
    </linearGradient>

    <!-- Swirl 2: Top to Right (Blue to Purple to Hot Pink) -->
    <linearGradient id="pcl-swirl-pink" x1="100" y1="20" x2="175" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="35%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>

    <!-- Swirl 3: Right to Bottom (Hot Pink to Magenta to Purple) -->
    <linearGradient id="pcl-swirl-magenta" x1="170" y1="90" x2="90" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF1493" />
      <stop offset="40%" stop-color="#E11D48" />
      <stop offset="75%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Swirl 4: Bottom to Left (Purple to Indigo to Cyan) -->
    <linearGradient id="pcl-swirl-purple" x1="110" y1="175" x2="20" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>

    <!-- Inner Employee Bust Gradient -->
    <linearGradient id="pcl-employee" x1="65" y1="65" x2="125" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="40%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Rupee Coin Gradient -->
    <linearGradient id="pcl-coin" x1="105" y1="105" x2="142" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="55%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Node 1 (Top Blue) -->
    <linearGradient id="pcl-node-top" x1="85" y1="0" x2="115" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Node 2 (Right Coral/Pink) -->
    <linearGradient id="pcl-node-right" x1="160" y1="80" x2="188" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4081" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Node 3 (Bottom Purple/Pink) -->
    <linearGradient id="pcl-node-bottom" x1="80" y1="155" x2="115" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Node 4 (Left Cyan) -->
    <linearGradient id="pcl-node-left" x1="0" y1="80" x2="30" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Wordmark "Chakra" Gradient: Blue to Indigo to Violet to Magenta -->
    <linearGradient id="pcl-chakra-text" x1="180" y1="95" x2="515" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="26%" stop-color="#2563EB" />
      <stop offset="52%" stop-color="#5558EB" />
      <stop offset="78%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <filter id="pcl-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- ==================== LEFT ICON: CHAKRA EMBLEM ==================== -->
  <g id="chakra-emblem" transform="translate(10, 0)">
    <!-- Swirl 1 (Cyan to Blue, upper left to top-center) -->
    <path d="M 32 108 C 16 80, 24 45, 52 25 C 72 10, 94 8, 114 12 C 86 16, 60 30, 48 54 C 36 78, 42 102, 54 120 C 44 118, 37 114, 32 108 Z" fill="url(#pcl-swirl-cyan)" />

    <!-- Swirl 2 (Blue to Purple to Hot Pink, top to right) -->
    <path d="M 98 14 C 132 12, 164 28, 178 58 C 188 78, 185 102, 176 122 C 174 94, 160 70, 136 56 C 112 42, 88 46, 70 56 C 76 44, 86 28, 98 14 Z" fill="url(#pcl-swirl-pink)" />

    <!-- Swirl 3 (Pink to Magenta to Purple, right to bottom) -->
    <path d="M 174 92 C 188 122, 178 156, 150 174 C 130 188, 106 189, 86 184 C 114 180, 138 166, 150 142 C 162 118, 156 94, 144 76 C 154 78, 166 84, 174 92 Z" fill="url(#pcl-swirl-magenta)" />

    <!-- Swirl 4 (Purple to Blue to Cyan, bottom to left) -->
    <path d="M 106 184 C 70 186, 38 170, 24 140 C 14 120, 16 96, 26 76 C 28 104, 42 128, 66 142 C 90 156, 114 152, 132 142 C 126 154, 116 170, 106 184 Z" fill="url(#pcl-swirl-purple)" />

    <!-- 4 Community Nodes / Heads -->
    <!-- Top Node -->
    <circle cx="106" cy="18" r="14.5" fill="url(#pcl-node-top)" />
    <!-- Right Node -->
    <circle cx="180" cy="98" r="14.5" fill="url(#pcl-node-right)" />
    <!-- Bottom Node -->
    <circle cx="102" cy="178" r="14.5" fill="url(#pcl-node-bottom)" />
    <!-- Left Node -->
    <circle cx="24" cy="98" r="14.5" fill="url(#pcl-node-left)" />

    <!-- Inner Employee Figure -->
    <!-- Head -->
    <circle cx="98" cy="74" r="17.5" fill="url(#pcl-employee)" />
    <!-- Shoulders & Torso -->
    <path d="M 68 136 C 66 116, 80 102, 98 102 C 116 102, 130 116, 128 136 C 124 140, 72 140, 68 136 Z" fill="url(#pcl-employee)" />

    <!-- Overlaid Rupee Coin (lower right of person torso) -->
    <circle cx="124" cy="128" r="18.5" fill="url(#pcl-coin)" stroke="#ffffff" stroke-width="2.5" />
    
    <!-- White Indian Rupee Symbol (₹) -->
    <g transform="translate(116, 117)" stroke="#ffffff" fill="#ffffff">
      <!-- Upper horizontal bar -->
      <line x1="1" y1="3" x2="14" y2="3" stroke-width="2.2" stroke-linecap="round" />
      <!-- Lower horizontal bar -->
      <line x1="1" y1="7.2" x2="11.5" y2="7.2" stroke-width="2.2" stroke-linecap="round" />
      <!-- Central loop & stem -->
      <path d="M 4 3 L 4 12 C 7 12, 11 11, 11 7.2 C 11 4, 8 3, 4 3 Z" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Slanted leg -->
      <line x1="4.5" y1="12" x2="13.5" y2="20.5" stroke-width="2.4" stroke-linecap="round" />
    </g>
  </g>

  <!-- ==================== RIGHT WORDMARK: PayChakra ==================== -->
  <g transform="translate(225, 0)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif">
    <text x="0" y="132" font-size="112" font-weight="700" letter-spacing="-0.025em">
      <tspan fill="#0052FF">Pay</tspan><tspan fill="url(#pcl-chakra-text)">Chakra</tspan>
    </text>
  </g>
</svg>
